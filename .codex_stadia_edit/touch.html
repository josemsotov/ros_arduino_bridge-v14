<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Trolley Touch</title>
  <style>
    :root {
      --bg: #08090b;
      --panel: #14171c;
      --panel2: #1d222a;
      --line: #343b48;
      --text: #f3f6fb;
      --muted: #9aa5b5;
      --ok: #35d08b;
      --warn: #f3b84c;
      --bad: #ff5d66;
      --blue: #67a7ff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      overflow: auto;
      user-select: none;
    }
    .screen {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 56px minmax(420px, 1fr) 252px;
      gap: 8px;
      padding: 8px;
    }
    header {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .brand {
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill {
      min-width: 86px;
      min-height: 46px;
      display: grid;
      place-items: center;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-weight: 800;
    }
    .pill.ok { color: #b7f7d8; border-color: #247a53; background: #10251d; }
    .pill.warn { color: #ffe2a0; border-color: #74551b; background: #2b2110; }
    .pill.bad { color: #ffd2d6; border-color: #84313b; background: #35171c; }
    main {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
    }
    .camera {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr) 156px;
      gap: 8px;
    }
    .view {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #020304;
    }
    .view img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .metric {
      min-width: 0;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .metric label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .metric strong {
      display: block;
      font-size: 21px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .side {
      min-height: 0;
      display: grid;
      grid-template-rows: 78px 78px 1fr;
      gap: 8px;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--text);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(1px); filter: brightness(1.16); }
    .btn-primary { background: #103123; border-color: #247a53; color: #bcf7d8; }
    .btn-warn { background: #342811; border-color: #785817; color: #ffe0a0; }
    .btn-exit { background: #1c2530; border-color: #526476; color: #dce9f5; }
    .btn-exit.armed { background: #5b1f12; border-color: #c65c32; color: #ffe1d4; }
    .header-exit {
      min-width: 76px;
      min-height: 46px;
      padding: 0 8px;
      font-size: 13px;
    }
    .btn-stop {
      background: #651923;
      border-color: #b63743;
      color: #ffe1e4;
      font-size: 30px;
      letter-spacing: 0;
    }
    .pill.blue { color: #c2d8ff; border-color: #2a5ca8; background: #0d1629; }
    .mode-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .btn-mode {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      color: var(--muted);
      font: inherit;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      touch-action: manipulation;
    }
    .btn-mode:active { transform: translateY(1px); filter: brightness(1.16); }
    .btn-mode.active-follower { background: #103123; border-color: #247a53; color: #bcf7d8; }
    .btn-mode.active-stadia   { background: #0d1f3c; border-color: #2a5ca8; color: #c2d8ff; }
    .btn-mode.active-gesture  { background: #342811; border-color: #785817; color: #ffe0a0; }
    .drive {
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-template-rows: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .drive button { font-size: 20px; }
    .empty { visibility: hidden; }
    footer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .footer-card {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 8px;
    }
    .footer-card label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      display: block;
      margin-bottom: 8px;
    }
    input[type="range"] { width: 100%; height: 34px; }
    .small-row {
      display: grid;
      grid-template-columns: 1fr 72px;
      gap: 8px;
      align-items: center;
    }
    .value { font-size: 20px; font-weight: 900; text-align: right; }
    @media (max-width: 760px), (max-height: 720px) {
      .screen { grid-template-rows: 50px minmax(0, 1fr) 104px; padding: 6px; gap: 6px; }
      main { grid-template-columns: minmax(0, 1fr); gap: 6px; }
      .camera { grid-template-rows: minmax(0, 1fr) 142px; }
      .side { grid-template-rows: 68px 64px 1fr; gap: 6px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .metric strong { font-size: 18px; }
      .drive { gap: 6px; }
      footer { gap: 6px; }
      .brand { font-size: 16px; }
      .pill { min-width: 70px; min-height: 42px; font-size: 12px; }
      .header-exit { min-width: 64px; min-height: 42px; font-size: 12px; }
      .btn-stop { font-size: 24px; }
    }
    @media (min-width: 900px) and (orientation: landscape) {
      .screen { max-width: 620px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand">Smart Trolley</div>
      <div id="conn" class="pill bad">OFFLINE</div>
      <div id="batteryPill" class="pill warn">BAT --</div>
      <div id="mode" class="pill">WAIT</div>
      <button id="exitKiosk" class="btn-exit header-exit">SALIR</button>
    </header>

    <main>
      <section class="camera">
        <div class="view"><img id="rgb" alt="RGB"></div>
        <div class="metrics">
          <div class="metric"><label>Target</label><strong id="target">--</strong></div>
          <div class="metric"><label>Front</label><strong id="front">--</strong></div>
          <div class="metric"><label>Left RPM</label><strong id="lrpm">--</strong></div>
          <div class="metric"><label>Right RPM</label><strong id="rrpm">--</strong></div>
        </div>
      </section>

      <section class="side">
        <button id="stop" class="btn-stop">STOP</button>
        <div class="mode-row">
          <button id="modeFollower" class="btn-mode">SEGUIR</button>
          <button id="modeStadia" class="btn-mode">STADIA</button>
          <button id="modeGesture" class="btn-mode">GESTO</button>
        </div>
        <div class="drive">
          <button class="empty"></button>
          <button data-drive="fwd">UP</button>
          <button class="empty"></button>
          <button data-drive="left">LEFT</button>
          <button data-drive="halt" class="btn-stop">STOP</button>
          <button data-drive="right">RIGHT</button>
          <button class="empty"></button>
          <button data-drive="back">DOWN</button>
          <button class="empty"></button>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-card">
        <label>Linear</label>
        <div class="small-row">
          <input id="linearMax" type="range" min="0.05" max="0.45" step="0.05" value="0.15">
          <div id="linearMaxVal" class="value">0.15</div>
        </div>
      </div>
      <div class="footer-card">
        <label>Angular</label>
        <div class="small-row">
          <input id="angularMax" type="range" min="0.10" max="0.90" step="0.10" value="0.30">
          <div id="angularMaxVal" class="value">0.30</div>
        </div>
      </div>
      <div class="footer-card">
        <label>Gesture</label>
        <div id="gesture" class="value" style="text-align:left">--</div>
      </div>
    </footer>
  </div>

<script>
const $ = (id) => document.getElementById(id);
let driveTimer = null;
let lastState = null;
let exitArmed = false;
let exitTimer = null;
let gamepadEnabled = false;
let gamepadIndex = null;
let gamepadManualActive = false;
let gamepadLastSent = 0;
let gamepadPrevButtons = [];
let gamepadLoop = null;
let activeMode = 'STADIA';

function fmt(v, d = 2, suffix = '') {
  return (v === null || v === undefined || Number.isNaN(Number(v))) ? '--' : Number(v).toFixed(d) + suffix;
}
async function postJson(url, payload = {}) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function sendCmd(linear, angular) {
  return postJson('/api/cmd_vel', {linear, angular}).catch(console.error);
}
function stopMotion() {
  clearInterval(driveTimer);
  driveTimer = null;
  gamepadManualActive = false;
  return postJson('/api/stop').catch(console.error);
}
function exitKiosk() {
  if (!exitArmed) {
    exitArmed = true;
    $('exitKiosk').textContent = 'CONFIRMAR';
    $('exitKiosk').classList.add('armed');
    clearTimeout(exitTimer);
    exitTimer = setTimeout(() => {
      exitArmed = false;
      $('exitKiosk').textContent = 'SALIR';
      $('exitKiosk').classList.remove('armed');
    }, 3500);
    return;
  }
  stopMotion();
  postJson('/api/kiosk/exit')
    .catch(() => {
      window.close();
      location.href = 'about:blank';
    });
}
function startDrive(mode) {
  clearInterval(driveTimer);
  const lmax = Number($('linearMax').value);
  const amax = Number($('angularMax').value);
  let linear = 0, angular = 0;
  if (mode === 'fwd') linear = lmax;
  if (mode === 'back') linear = -lmax;
  if (mode === 'left') angular = amax;
  if (mode === 'right') angular = -amax;
  if (mode === 'halt') { stopMotion(); return; }
  sendCmd(linear, angular);
  driveTimer = setInterval(() => sendCmd(linear, angular), 140);
}
function axisWithDeadzone(value, deadzone = 0.14) {
  const v = Math.abs(value) < deadzone ? 0 : value;
  return Math.max(-1, Math.min(1, v));
}
function findGamepad() {
  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
  const connected = pads.filter(Boolean);
  return connected.find(p => /stadia/i.test(p.id)) || connected[0] || null;
}
function setGamepadUi(status, ok = false, warn = false) {
  // Gamepad connectivity reflected via STADIA mode button highlight
}
function handleGamepadButton(buttons, index, callback) {
  const pressed = Boolean(buttons[index] && buttons[index].pressed);
  if (pressed && !gamepadPrevButtons[index]) callback();
  gamepadPrevButtons[index] = pressed;
}
function processGamepad() {
  if (!gamepadEnabled) return;
  const pad = gamepadIndex !== null && navigator.getGamepads
    ? navigator.getGamepads()[gamepadIndex]
    : findGamepad();
  if (!pad) {
    gamepadIndex = null;
    gamepadLoop = requestAnimationFrame(processGamepad);
    return;
  }
  gamepadIndex = pad.index;
  handleGamepadButton(pad.buttons, 0, stopMotion);
  handleGamepadButton(pad.buttons, 1, () => applyMode('IDLE'));
  handleGamepadButton(pad.buttons, 3, () => applyMode('FOLLOWER'));
  const linear = axisWithDeadzone(-(pad.axes[1] || 0)) * Number($('linearMax').value);
  const angular = axisWithDeadzone(-(pad.axes[2] || 0)) * Number($('angularMax').value);
  const moving = Math.abs(linear) > 0.001 || Math.abs(angular) > 0.001;
  const now = performance.now();
  if (moving && now - gamepadLastSent > 90) {
    sendCmd(linear, angular);
    gamepadManualActive = true;
    gamepadLastSent = now;
  } else if (!moving && gamepadManualActive && now - gamepadLastSent > 90) {
    sendCmd(0, 0);
    gamepadManualActive = false;
    gamepadLastSent = now;
  }
  gamepadLoop = requestAnimationFrame(processGamepad);
}
function setGamepadEnabled(enabled) {
  gamepadEnabled = enabled && Boolean(navigator.getGamepads);
  gamepadPrevButtons = [];
  if (!gamepadEnabled) {
    if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
    gamepadLoop = null;
    gamepadIndex = null;
    if (gamepadManualActive) sendCmd(0, 0);
    gamepadManualActive = false;
    return;
  }
  if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
  gamepadLoop = null;
  processGamepad();
}
function setConn(ok) {
  $('conn').textContent = ok ? 'ONLINE' : 'OFFLINE';
  $('conn').className = ok ? 'pill ok' : 'pill bad';
}
function updateBattery(status) {
  const pill = $('batteryPill');
  if (!pill) return;
  if (!status || !status.present) {
    pill.textContent = 'BAT --';
    pill.className = 'pill bad';
    pill.title = status && status.error ? status.error : 'X1202 battery gauge not detected';
    return;
  }
  const percent = (status.percent === null || status.percent === undefined) ? null : Number(status.percent);
  const voltage = (status.voltage === null || status.voltage === undefined) ? null : Number(status.voltage);
  pill.textContent = percent === null ? 'BAT --' : `BAT ${Math.round(percent)}%`;
  pill.className = `pill ${status.status === 'ok' ? 'ok' : status.status === 'warn' ? 'warn' : 'bad'}`;
  pill.title = voltage === null ? 'X1202 battery' : `X1202 ${voltage.toFixed(3)}V @ ${percent.toFixed(1)}%`;
}
const MODE_LABELS = { FOLLOWER: 'SEGUIDOR', STADIA: 'STADIA', GESTURE: 'GESTOS', IDLE: 'IDLE' };
const MODE_CLASSES = { FOLLOWER: 'pill ok', STADIA: 'pill blue', GESTURE: 'pill warn', IDLE: 'pill' };
function setModePill(mode) {
  $('mode').textContent = MODE_LABELS[mode] || mode;
  $('mode').className = MODE_CLASSES[mode] || 'pill';
}
function syncModeButtons(mode) {
  $('modeFollower').className = 'btn-mode' + (mode === 'FOLLOWER' ? ' active-follower' : '');
  $('modeStadia').className   = 'btn-mode' + (mode === 'STADIA'   ? ' active-stadia'   : '');
  $('modeGesture').className  = 'btn-mode' + (mode === 'GESTURE'  ? ' active-gesture'  : '');
}
async function applyMode(mode) {
  activeMode = mode;
  syncModeButtons(mode);
  setModePill(mode);
  if (mode !== 'STADIA') setGamepadEnabled(false);
  try {
    await postJson('/api/mode', {mode});
    if (mode === 'STADIA') setGamepadEnabled(true);
  } catch(e) { console.error('applyMode:', e); }
}
function update(s) {
  lastState = s;
  setConn(true);
  const serverMode = ((s.robot_mode) || 'IDLE').toUpperCase();
  setModePill(serverMode);
  if (serverMode !== activeMode) {
    activeMode = serverMode;
    syncModeButtons(serverMode);
    if (serverMode !== 'STADIA' && gamepadEnabled) setGamepadEnabled(false);
  }
  $('target').textContent = fmt(s.follower_debug.target_dist, 2, ' m');
  $('front').textContent = fmt(s.scan.front_min, 2, ' m');
  $('lrpm').textContent = fmt(s.motor_status.Lrpm, 0);
  $('rrpm').textContent = fmt(s.motor_status.Rrpm, 0);
  $('gesture').textContent = (s.gesture_status && s.gesture_status.state) || '--';
  updateBattery(s.battery_status);
}
function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setConn(true);
  ws.onmessage = (event) => update(JSON.parse(event.data));
  ws.onclose = () => { setConn(false); setTimeout(connectWs, 1000); };
}

$('modeFollower').onclick = () => applyMode(activeMode === 'FOLLOWER' ? 'IDLE' : 'FOLLOWER');
$('modeStadia').onclick   = () => applyMode(activeMode === 'STADIA'   ? 'IDLE' : 'STADIA');
$('modeGesture').onclick  = () => applyMode(activeMode === 'GESTURE'  ? 'IDLE' : 'GESTURE');
$('stop').onclick = () => {
  stopMotion();
  activeMode = 'IDLE';
  syncModeButtons('IDLE');
  setModePill('IDLE');
};
$('exitKiosk').onclick = exitKiosk;
window.addEventListener('gamepadconnected', (ev) => {
  if (gamepadEnabled) {
    gamepadIndex = ev.gamepad.index;
    if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
    gamepadLoop = null;
    processGamepad();
  }
});
window.addEventListener('gamepaddisconnected', () => {
  gamepadIndex = null;
  if (gamepadManualActive) sendCmd(0, 0);
  gamepadManualActive = false;
});
document.querySelectorAll('[data-drive]').forEach(btn => {
  btn.addEventListener('pointerdown', () => startDrive(btn.dataset.drive));
  btn.addEventListener('pointerup', stopMotion);
  btn.addEventListener('pointercancel', stopMotion);
  btn.addEventListener('pointerleave', () => { if (driveTimer) stopMotion(); });
});
$('linearMax').oninput = () => $('linearMaxVal').textContent = Number($('linearMax').value).toFixed(2);
$('angularMax').oninput = () => $('angularMaxVal').textContent = Number($('angularMax').value).toFixed(2);

setInterval(() => {
  $('rgb').src = '/api/frame/rgb.jpg?t=' + Date.now();
}, 300);
connectWs();
</script>
</body>
</html>
