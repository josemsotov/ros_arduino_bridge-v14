<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Smart Caddie</title>
  <style>
    :root {
      --bg: #0b0d0c;
      --panel: #151917;
      --panel2: #1d2420;
      --line: #344039;
      --text: #f2f6f1;
      --muted: #a1aca4;
      --green: #38cf83;
      --fairway: #d6f4b3;
      --warn: #f3bb4b;
      --bad: #ff636b;
      --blue: #77aaff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Segoe UI, Roboto, Arial, sans-serif;
      user-select: none;
    }
    button, input, select {
      font: inherit;
      color: var(--text);
    }
    button {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      font-weight: 900;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(1px); filter: brightness(1.15); }
    input, select {
      min-width: 0;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f1311;
      padding: 0 10px;
      outline: none;
    }
    .screen {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      gap: 8px;
      padding: 8px;
    }
    header {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto;
      gap: 8px;
      align-items: center;
    }
    .brand {
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .brand strong {
      display: block;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pill {
      min-width: 68px;
      min-height: 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      padding: 0 9px;
    }
    .pill.ok { color: #bff5d7; border-color: #267a51; background: #10251d; }
    .pill.warn { color: #ffe0a0; border-color: #76571c; background: #2b2110; }
    .pill.bad { color: #ffd3d7; border-color: #82313b; background: #35171c; }
    .btn-stop { background: #651923; border-color: #b63743; color: #ffe1e4; }
    .btn-ok { background: #123524; border-color: #247a53; color: #bcf7d8; }
    .btn-warn { background: #342811; border-color: #785817; color: #ffe0a0; }
    .btn-blue { background: #16263f; border-color: #385c96; color: #d6e5ff; }
    .btn-exit { background: #2a2220; border-color: #725146; color: #ffd9ca; }
    main { min-height: 0; }
    .mode-panel { display: none; height: 100%; min-height: 0; }
    .mode-panel.active { display: grid; }
    .home {
      grid-template-rows: 1fr;
      align-items: stretch;
    }
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      min-height: 0;
    }
    .mode-card {
      min-width: 0;
      min-height: 0;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
      display: grid;
      align-content: space-between;
      gap: 14px;
    }
    .mode-card strong {
      display: block;
      font-size: clamp(28px, 5vw, 52px);
      line-height: .95;
      letter-spacing: 0;
    }
    .mode-card span {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.3;
      font-weight: 800;
    }
    .mode-card.golf { background: #102319; border-color: #315a40; }
    .mode-card.move { background: #121d2a; border-color: #335171; }
    .mode-card.tests { background: #241b12; border-color: #674820; }
    .panel-layout {
      grid-template-columns: minmax(0, 1.15fr) minmax(280px, .85fr);
      gap: 8px;
      min-height: 0;
    }
    section {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      overflow: hidden;
    }
    .section-head {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .section-body {
      padding: 10px;
      display: grid;
      gap: 8px;
    }
    .shot-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .distance-card {
      min-height: 152px;
      grid-column: span 2;
      display: grid;
      align-content: center;
      border: 1px solid #3a5542;
      border-radius: 8px;
      background: #112319;
      padding: 14px;
    }
    label, .distance-card label, .metric label {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .distance-card strong {
      font-size: clamp(54px, 11vw, 96px);
      line-height: .9;
      color: var(--fairway);
      letter-spacing: 0;
    }
    .metric {
      min-width: 0;
      min-height: 72px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel2);
      padding: 10px;
    }
    .metric strong {
      display: block;
      font-size: 24px;
      line-height: 1.05;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .course-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 84px;
      gap: 8px;
    }
    .results, .test-list {
      max-height: 210px;
      overflow: auto;
      display: grid;
      gap: 6px;
    }
    .result, .test-btn {
      min-height: 48px;
      text-align: left;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 900;
    }
    .result span, .test-btn span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .test-btn.danger { border-color: #8a5c20; background: #33230f; color: #ffe0a0; }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .field input, .field select { width: 100%; }
    .action-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .camera-view {
      min-height: 260px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #020403;
      overflow: hidden;
    }
    .camera-view img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .drive {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .drive button { min-height: 64px; font-size: 18px; }
    .empty { visibility: hidden; }
    .controller-panel {
      display: grid;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111715;
      padding: 10px;
    }
    .controller-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }
    .controller-head b { color: var(--bad); }
    .controller-head b.ok { color: var(--green); }
    .controller-head b.warn { color: var(--warn); }
    .controller-readout {
      min-height: 34px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }
    .identity-panel {
      display: grid;
      gap: 8px;
      border: 1px solid #315346;
      border-radius: 8px;
      background: #0d1815;
      padding: 10px;
    }
    .identity-grid {
      grid-template-columns: minmax(120px, 1fr) minmax(70px, .55fr) minmax(120px, 1fr);
    }
    .range-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      gap: 8px;
      align-items: center;
    }
    input[type="range"] { width: 100%; min-height: 30px; padding: 0; }
    .value {
      font-size: 18px;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
    }
    pre {
      margin: 0;
      min-height: 280px;
      max-height: calc(100vh - 220px);
      overflow: auto;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #090c0a;
      color: #dce8df;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre-wrap;
    }
    @media (max-width: 820px), (max-height: 620px) {
      .screen { grid-template-rows: 50px minmax(0, 1fr); padding: 6px; gap: 6px; }
      header { grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 5px; }
      #homeBtn, #exitBtn { min-width: 52px; padding: 0 7px; font-size: 11px; }
      .pill { min-width: 58px; min-height: 40px; font-size: 11px; }
      .mode-grid, .panel-layout { grid-template-columns: 1fr; overflow: auto; }
      section { overflow: visible; }
      .shot-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .distance-card { min-height: 116px; }
      .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .camera-view { min-height: 160px; }
      .drive button { min-height: 50px; }
      pre { max-height: 300px; }
      .brand strong { font-size: 15px; }
    }
    @media (min-width: 900px) and (orientation: landscape) {
      .screen { max-width: 980px; margin: 0 auto; }
    }
  </style>
</head>
<body>
  <div class="screen">
    <header>
      <div class="brand">
        <strong id="title">Smart Caddie</strong>
        <span id="subtitle">Selecciona un modo</span>
      </div>
      <button id="homeBtn" class="btn-blue">MENU</button>
      <button id="exitBtn" class="btn-exit">SALIR</button>
      <div id="conn" class="pill bad">OFF</div>
      <div id="mode" class="pill">WAIT</div>
    </header>

    <main>
      <div id="homePanel" class="mode-panel home active">
        <div class="mode-grid">
          <button class="mode-card golf" data-mode="golf">
            <strong>Golf</strong>
            <span>Campo, hoyo, distancias, palo recomendado y registro de golpes.</span>
          </button>
          <button class="mode-card move" data-mode="movement">
            <strong>Movimiento</strong>
            <span>Control manual del trolley, seguimiento, camara, lidar y velocidades.</span>
          </button>
          <button class="mode-card tests" data-mode="tests">
            <strong>Pruebas y Reparaciones</strong>
            <span>Balance, motores, Hall, LiDAR, camara, sensores y reparacion del tactil.</span>
          </button>
        </div>
      </div>

      <div id="golfPanel" class="mode-panel panel-layout">
        <section>
          <div class="section-head">
            <span id="holeTitle">Hoyo 1</span>
            <span id="distanceSource">Manual</span>
          </div>
          <div class="section-body">
            <div class="shot-grid">
              <div class="distance-card">
                <label>Centro green</label>
                <strong id="centerDistance">--</strong>
                <span class="sub">yardas</span>
              </div>
              <div class="metric">
                <label>Palo</label>
                <strong id="clubPick">--</strong>
                <div id="clubCarry" class="sub">--</div>
              </div>
              <div class="metric"><label>Front</label><strong id="frontDistance">--</strong></div>
              <div class="metric"><label>Back</label><strong id="backDistance">--</strong></div>
              <div class="metric"><label>Par</label><strong id="parValue">--</strong></div>
              <div class="metric">
                <label>Ultimo golpe</label>
                <strong id="lastShot">--</strong>
                <div id="lastShotMeta" class="sub">--</div>
              </div>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <span>Campo y hoyo</span>
            <span id="gpsStatus">GPS --</span>
          </div>
          <div class="section-body">
            <div class="course-search">
              <input id="courseQuery" autocomplete="off" placeholder="Buscar campo">
              <button id="courseSearch" class="btn-blue">BUSCAR</button>
            </div>
            <div id="courseResults" class="results"></div>

            <div class="field-grid">
              <div class="field"><label>Hoyo</label><input id="holeNumber" type="number" min="1" max="18" value="1"></div>
              <div class="field"><label>Par</label><input id="holePar" type="number" min="3" max="6" value="4"></div>
              <div class="field"><label>Front</label><input id="holeFront" type="number" min="0" max="800" inputmode="numeric"></div>
              <div class="field"><label>Centro</label><input id="holeCenter" type="number" min="0" max="800" value="380" inputmode="numeric"></div>
              <div class="field"><label>Back</label><input id="holeBack" type="number" min="0" max="800" inputmode="numeric"></div>
              <div class="field"><label>Yardas</label><input id="holeYardage" type="number" min="0" max="800" value="380" inputmode="numeric"></div>
              <div class="field"><label>Palo</label><select id="shotClub"></select></div>
              <div class="field"><label>Golpe</label><input id="shotYards" type="number" min="0" max="400" inputmode="numeric"></div>
            </div>
            <div class="action-row">
              <button id="saveHole" class="btn-ok">GUARDAR</button>
              <button id="useGps" class="btn-blue">GPS</button>
              <button id="logShot" class="btn-warn">GOLPE</button>
            </div>
          </div>
        </section>
      </div>

      <div id="movementPanel" class="mode-panel panel-layout">
        <section>
          <div class="section-head">
            <span>Vision y estado</span>
            <span id="gesture">--</span>
          </div>
          <div class="section-body">
            <div class="camera-view"><img id="rgb" alt="RGB"></div>
            <div class="shot-grid">
              <div class="metric"><label>Target</label><strong id="targetDist">--</strong></div>
              <div class="metric"><label>Frente</label><strong id="frontObstacle">--</strong></div>
              <div class="metric"><label>Left RPM</label><strong id="leftRpm">--</strong></div>
              <div class="metric"><label>Right RPM</label><strong id="rightRpm">--</strong></div>
            </div>
            <div class="identity-panel">
              <div class="controller-head">
                <span>Face ID</span>
                <b id="faceIdState">OFF</b>
              </div>
              <div class="field-grid identity-grid">
                <div class="field"><label>Jugador</label><input id="faceName" autocomplete="off" value="Jose"></div>
                <div class="metric"><label>Score</label><strong id="faceScore">--</strong></div>
                <div class="metric"><label>Perfil</label><strong id="faceProfile">--</strong></div>
              </div>
              <div class="action-row">
                <button id="faceEnroll" class="btn-blue">CAPTURAR</button>
                <button id="faceSave" class="btn-ok">GUARDAR</button>
                <button id="faceClear" class="btn-warn">LIMPIAR</button>
              </div>
              <div id="faceReadout" class="controller-readout">--</div>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <span>Movimiento</span>
            <span>Manual</span>
          </div>
          <div class="section-body">
            <div class="action-row">
              <button id="followOn" class="btn-ok">FOLLOW</button>
              <button id="followOff" class="btn-warn">WAIT</button>
              <button id="stop" class="btn-stop">STOP</button>
            </div>
            <div class="drive">
              <button class="empty"></button>
              <button data-drive="fwd">UP</button>
              <button class="empty"></button>
              <button data-drive="left">LEFT</button>
              <button data-drive="halt" class="btn-stop">STOP</button>
              <button data-drive="right">RIGHT</button>
              <button class="empty"></button>
              <button data-drive="back">DOWN</button>
              <button class="empty"></button>
            </div>
            <div class="controller-panel">
              <div class="controller-head">
                <span>Stadia</span>
                <b id="gamepadStatus">OFF</b>
              </div>
              <div class="action-row">
                <button id="gamepadToggle" class="btn-ok">ENABLE</button>
                <button id="gamepadWait" class="btn-warn">WAIT</button>
                <button id="gamepadStop" class="btn-stop">A STOP</button>
              </div>
              <div id="gamepadReadout" class="controller-readout">Conecta el control y presiona un boton.</div>
            </div>
            <div>
              <label>Linear</label>
              <div class="range-row">
                <input id="linearMax" type="range" min="0.05" max="0.45" step="0.05" value="0.15">
                <div id="linearMaxVal" class="value">0.15</div>
              </div>
            </div>
            <div>
              <label>Angular</label>
              <div class="range-row">
                <input id="angularMax" type="range" min="0.10" max="0.90" step="0.10" value="0.30">
                <div id="angularMaxVal" class="value">0.30</div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div id="testsPanel" class="mode-panel panel-layout">
        <section>
          <div class="section-head">
            <span>Pruebas y Reparaciones</span>
            <span id="testStatus">Listo</span>
          </div>
          <div class="section-body">
            <div id="testList" class="test-list"></div>
            <div class="action-row">
              <button id="refreshTests" class="btn-blue">REFRESCAR</button>
              <button id="stopFromTests" class="btn-stop">STOP</button>
              <button id="clearLog" class="btn-warn">LIMPIAR</button>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <span>Salida</span>
            <span id="activeRun">--</span>
          </div>
          <div class="section-body">
            <pre id="testLog">Selecciona una prueba.</pre>
          </div>
        </section>
      </div>
    </main>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const bag = [
  ['DR', 230], ['3W', 205], ['HY', 185], ['5I', 170], ['6I', 160], ['7I', 150],
  ['8I', 138], ['9I', 126], ['PW', 112], ['GW', 98], ['SW', 82], ['PT', 10]
];
const panels = {
  home: $('homePanel'),
  golf: $('golfPanel'),
  movement: $('movementPanel'),
  tests: $('testsPanel')
};
let driveTimer = null;
let lastGolf = null;
let lastState = null;
let currentPosition = null;
let testsLoaded = false;
let coursesLoaded = false;
let identityLoaded = false;
let activeRunId = null;
let runPoll = null;
let gamepadEnabled = false;
let gamepadIndex = null;
let gamepadManualActive = false;
let gamepadLastSent = 0;
let gamepadPrevButtons = [];
let gamepadLoop = null;

function num(value) {
  if (value === '' || value === null || value === undefined) return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}
function yards(value) {
  const n = num(value);
  return n === null ? '--' : String(Math.round(n));
}
function meters(value) {
  const n = num(value);
  return n === null ? '--' : n.toFixed(1) + ' m';
}
function recommendClub(distance) {
  const d = num(distance);
  if (d === null) return null;
  return bag.reduce((best, item) => {
    const diff = Math.abs(item[1] - d);
    return diff < best.diff ? {name: item[0], carry: item[1], diff} : best;
  }, {name: '--', carry: 0, diff: Infinity});
}
async function postJson(url, payload = {}) {
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}
function courseSubtitle(course) {
  return course.city || course.country || course.display_name || course.source || '';
}
function renderCourseResults(courses, emptyText = 'Sin canchas') {
  const list = courses || [];
  $('courseResults').innerHTML = list.map((course, i) => (
    `<button class="result" data-course="${i}">
      ${escapeHtml(course.name)}
      <span>${escapeHtml(courseSubtitle(course))}</span>
    </button>`
  )).join('') || `<button class="result">${escapeHtml(emptyText)}<span>Busca o agrega datos manualmente</span></button>`;
  document.querySelectorAll('[data-course]').forEach((btn) => {
    btn.onclick = () => selectCourse(list[Number(btn.dataset.course)]).catch(console.error);
  });
}
async function selectCourse(course) {
  const saved = await postJson('/api/golf/course', {course});
  updateGolf(saved.golf);
}
function setModePanel(mode) {
  Object.values(panels).forEach(panel => panel.classList.remove('active'));
  panels[mode].classList.add('active');
  const titles = {
    home: ['Smart Caddie', 'Selecciona un modo'],
    golf: ['Golf', 'Campo, hoyo y distancias'],
    movement: ['Movimiento', 'Control del trolley'],
    tests: ['Pruebas', 'Diagnosticos y scripts']
  };
  $('title').textContent = titles[mode][0];
  $('subtitle').textContent = titles[mode][1];
  if (mode === 'golf' && !coursesLoaded) loadCourseCatalog();
  if (mode === 'movement' && !identityLoaded) loadIdentity();
  if (mode === 'tests' && !testsLoaded) loadTests();
}
function setConn(ok) {
  $('conn').textContent = ok ? 'ON' : 'OFF';
  $('conn').className = ok ? 'pill ok' : 'pill bad';
}
function setRobotMode(text, enabled) {
  $('mode').textContent = text || 'WAIT';
  $('mode').className = enabled ? 'pill ok' : text === 'WAITING' ? 'pill warn' : 'pill';
}
function sendCmd(linear, angular) {
  return postJson('/api/cmd_vel', {linear, angular}).catch(console.error);
}
function stopMotion() {
  clearInterval(driveTimer);
  driveTimer = null;
  gamepadManualActive = false;
  return postJson('/api/stop').catch(console.error);
}
function startDrive(mode) {
  clearInterval(driveTimer);
  const lmax = Number($('linearMax').value);
  const amax = Number($('angularMax').value);
  let linear = 0, angular = 0;
  if (mode === 'fwd') linear = lmax;
  if (mode === 'back') linear = -lmax;
  if (mode === 'left') angular = amax;
  if (mode === 'right') angular = -amax;
  if (mode === 'halt') { stopMotion(); return; }
  sendCmd(linear, angular);
  driveTimer = setInterval(() => sendCmd(linear, angular), 140);
}
function axisWithDeadzone(value, deadzone = 0.14) {
  const v = Math.abs(value) < deadzone ? 0 : value;
  return Math.max(-1, Math.min(1, v));
}
function findGamepad() {
  const pads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
  const connected = pads.filter(Boolean);
  return connected.find(p => /stadia/i.test(p.id)) || connected[0] || null;
}
function setGamepadUi(status, readout = '', ok = false) {
  $('gamepadStatus').textContent = status;
  $('gamepadStatus').className = ok ? 'ok' : '';
  $('gamepadReadout').textContent = readout;
  $('gamepadToggle').textContent = gamepadEnabled ? 'DISABLE' : 'ENABLE';
}
function handleGamepadButton(buttons, index, callback) {
  const pressed = Boolean(buttons[index] && buttons[index].pressed);
  if (pressed && !gamepadPrevButtons[index]) callback();
  gamepadPrevButtons[index] = pressed;
}
function processGamepad() {
  if (!gamepadEnabled) return;
  const pad = gamepadIndex !== null && navigator.getGamepads
    ? navigator.getGamepads()[gamepadIndex]
    : findGamepad();
  if (!pad) {
    gamepadIndex = null;
    setGamepadUi('PAIR', 'Conecta el control y presiona un boton.');
    gamepadLoop = requestAnimationFrame(processGamepad);
    return;
  }
  gamepadIndex = pad.index;

  handleGamepadButton(pad.buttons, 0, stopMotion);
  handleGamepadButton(pad.buttons, 1, () => postJson('/api/follower', {enabled: false}).then(() => sendCmd(0, 0)).catch(console.error));
  handleGamepadButton(pad.buttons, 3, () => postJson('/api/follower', {enabled: true}).catch(console.error));

  const angularAxis = Number.isFinite(pad.axes[2]) ? pad.axes[2] : (pad.axes[0] || 0);
  const linear = axisWithDeadzone(-(pad.axes[1] || 0)) * Number($('linearMax').value);
  const angular = axisWithDeadzone(-angularAxis) * Number($('angularMax').value);
  const moving = Math.abs(linear) > 0.001 || Math.abs(angular) > 0.001;
  const now = performance.now();
  if (moving && now - gamepadLastSent > 90) {
    if (!gamepadManualActive) postJson('/api/follower', {enabled: false}).catch(console.error);
    sendCmd(linear, angular);
    gamepadManualActive = true;
    gamepadLastSent = now;
  } else if (!moving && gamepadManualActive && now - gamepadLastSent > 90) {
    sendCmd(0, 0);
    gamepadManualActive = false;
    gamepadLastSent = now;
  }
  setGamepadUi('ON', `${pad.id} | L ${linear.toFixed(2)} A ${angular.toFixed(2)} | A stop, B wait, Y follow`, true);
  gamepadLoop = requestAnimationFrame(processGamepad);
}
function setGamepadEnabled(enabled) {
  gamepadEnabled = enabled && Boolean(navigator.getGamepads);
  gamepadPrevButtons = [];
  if (!gamepadEnabled) {
    if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
    gamepadLoop = null;
    gamepadIndex = null;
    if (gamepadManualActive) sendCmd(0, 0);
    gamepadManualActive = false;
    setGamepadUi('OFF', navigator.getGamepads ? 'Control desactivado.' : 'Gamepad API no disponible.');
    return;
  }
  if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
  gamepadLoop = null;
  processGamepad();
}
function fillShotClub() {
  $('shotClub').innerHTML = bag.map(([name, carry]) => `<option value="${name}">${name} ${carry}</option>`).join('');
}
function updateGolf(golf) {
  if (!golf) return;
  lastGolf = golf;
  const course = golf.course || {};
  const hole = golf.hole || {};
  if (panels.golf.classList.contains('active')) {
    $('subtitle').textContent = course.name || 'Campo no seleccionado';
  }
  $('holeTitle').textContent = `Hoyo ${hole.number || 1}`;
  $('distanceSource').textContent = golf.distance_source === 'gps' ? 'GPS' : 'Manual';
  $('centerDistance').textContent = yards(hole.center);
  $('frontDistance').textContent = yards(hole.front);
  $('backDistance').textContent = yards(hole.back);
  $('parValue').textContent = hole.par || '--';
  $('holeNumber').value = hole.number || 1;
  $('holePar').value = hole.par || 4;
  $('holeFront').value = hole.front ?? '';
  $('holeCenter').value = hole.center ?? '';
  $('holeBack').value = hole.back ?? '';
  $('holeYardage').value = hole.yardage || hole.center || '';
  const pick = recommendClub(hole.center);
  $('clubPick').textContent = pick ? pick.name : '--';
  $('clubCarry').textContent = pick ? `${pick.carry} yd carry` : '--';
  if (golf.position) {
    currentPosition = {
      lat: golf.position.lat,
      lon: golf.position.lon,
      accuracy: golf.position.accuracy,
      source: golf.position.source || 'robot_gps'
    };
    const acc = golf.position.accuracy ? ` +/- ${Math.round(golf.position.accuracy)}m` : '';
    const src = golf.position.source === 'robot_gps' ? 'ROBOT' : 'OK';
    $('gpsStatus').textContent = `GPS ${src}${acc}`;
  }
  const shot = golf.last_shot;
  $('lastShot').textContent = shot ? `${shot.club || '--'} ${yards(shot.yards)} yd` : '--';
  $('lastShotMeta').textContent = shot && shot.result ? shot.result : '--';
}
function faceStateClass(status, verified) {
  if (verified || ['locked', 'verified', 'armed'].includes(status)) return 'ok';
  if (['capturing', 'enrolling', 'cleared', 'idle'].includes(status)) return 'warn';
  return '';
}
function updateIdentity(view) {
  const follower = (view && view.follower_state) || {};
  const saved = (view && view.face_id) || {};
  const status = String(follower.identity_status || saved.status || 'idle');
  const verified = Boolean(follower.identity_verified);
  const score = follower.identity_score ?? saved.score;
  const visual = follower.identity_description || saved.visual || '--';
  const name = saved.name || $('faceName').value || 'Jugador';
  $('faceIdState').textContent = status.toUpperCase();
  $('faceIdState').className = faceStateClass(status, verified);
  $('faceScore').textContent = Number.isFinite(Number(score)) ? Number(score).toFixed(2) : '--';
  $('faceProfile').textContent = visual;
  $('faceReadout').textContent = `${name} | ${verified ? 'verificado' : 'pendiente'} | ${visual}`;
  if (saved.name && document.activeElement !== $('faceName')) $('faceName').value = saved.name;
}
async function loadIdentity() {
  try {
    const res = await getJson('/api/identity');
    updateIdentity(res);
    identityLoaded = true;
  } catch (err) {
    $('faceReadout').textContent = String(err);
  }
}
async function enrollFaceId() {
  $('faceEnroll').textContent = '...';
  try {
    const res = await postJson('/api/identity/enroll', {name: $('faceName').value.trim() || 'Jugador'});
    updateIdentity(res);
    $('faceReadout').textContent = `${res.face_id.name || 'Jugador'} | capturando`;
  } finally {
    $('faceEnroll').textContent = 'CAPTURAR';
  }
}
async function saveFaceId() {
  $('faceSave').textContent = '...';
  try {
    const res = await postJson('/api/identity/save', {name: $('faceName').value.trim() || 'Jugador'});
    updateIdentity(res);
  } catch (err) {
    $('faceReadout').textContent = String(err);
  } finally {
    $('faceSave').textContent = 'GUARDAR';
  }
}
async function clearFaceId() {
  $('faceClear').textContent = '...';
  try {
    const res = await postJson('/api/identity/clear', {});
    updateIdentity(res);
  } finally {
    $('faceClear').textContent = 'LIMPIAR';
  }
}
function updateRobot(s) {
  lastState = s;
  setConn(true);
  const mode = (s.follower_state && s.follower_state.mode) || (s.follower_enabled ? 'FOLLOW' : 'WAITING');
  const enabled = s.follower_state && typeof s.follower_state.enabled === 'boolean'
    ? s.follower_state.enabled
    : s.follower_enabled;
  setRobotMode(mode, enabled);
  $('frontObstacle').textContent = meters(s.scan && s.scan.front_min);
  $('targetDist').textContent = meters(s.follower_debug && s.follower_debug.target_dist);
  $('leftRpm').textContent = yards(s.motor_status && s.motor_status.Lrpm);
  $('rightRpm').textContent = yards(s.motor_status && s.motor_status.Rrpm);
  $('gesture').textContent = (s.gesture_status && s.gesture_status.state) || '--';
  updateIdentity(s);
  if ((!s.golf || !s.golf.position) && s.gps_status) {
    if (s.gps_status.fix === 0 || s.gps_status.fix === '0') {
      $('gpsStatus').textContent = 'GPS SIN FIX';
    } else if (s.gps_status.raw) {
      $('gpsStatus').textContent = 'GPS BUSCANDO';
    }
  }
  updateGolf(s.golf);
}
async function loadGolf() {
  try {
    const res = await getJson('/api/golf/state');
    updateGolf(res.golf);
  } catch (err) {
    console.error(err);
  }
}
async function loadCourseCatalog() {
  try {
    const res = await getJson('/api/golf/courses');
    renderCourseResults(res.results || [], 'Sin canchas guardadas');
    coursesLoaded = true;
  } catch (err) {
    $('courseResults').innerHTML = `<button class="result">Error<span>${escapeHtml(String(err).slice(0, 80))}</span></button>`;
  }
}
async function searchCourse() {
  const query = $('courseQuery').value.trim();
  $('courseResults').innerHTML = '';
  if (!query) {
    coursesLoaded = false;
    await loadCourseCatalog();
    return;
  }
  $('courseSearch').textContent = '...';
  try {
    const payload = {query};
    if (currentPosition) Object.assign(payload, currentPosition);
    const res = await postJson('/api/golf/search', payload);
    if (!res.ok && !(res.results || []).length) {
      $('courseResults').innerHTML = `<button class="result">Sin internet<span>${escapeHtml(res.error || 'Busqueda no disponible')}</span></button>`;
      return;
    }
    renderCourseResults(res.results || [], 'Sin resultados');
  } catch (err) {
    $('courseResults').innerHTML = `<button class="result">Error<span>${escapeHtml(String(err).slice(0, 80))}</span></button>`;
  } finally {
    $('courseSearch').textContent = 'BUSCAR';
  }
}
async function exitKiosk() {
  if (!window.confirm('Salir de Smart Caddie?')) return;
  $('exitBtn').textContent = '...';
  try {
    await postJson('/api/kiosk/exit');
  } catch (err) {
    $('exitBtn').textContent = 'ERROR';
    setTimeout(() => { $('exitBtn').textContent = 'SALIR'; }, 1600);
  }
}
async function saveHole() {
  const front = num($('holeFront').value);
  const center = num($('holeCenter').value);
  const back = num($('holeBack').value);
  const yardage = num($('holeYardage').value) || center || 0;
  const payload = {
    number: num($('holeNumber').value) || 1,
    par: num($('holePar').value) || 4,
    front,
    center: center || yardage,
    back,
    yardage
  };
  const res = await postJson('/api/golf/hole', payload);
  updateGolf(res.golf);
}
function useGps() {
  if (lastGolf && lastGolf.position && lastGolf.position.source === 'robot_gps') {
    $('gpsStatus').textContent = 'GPS ROBOT';
    currentPosition = lastGolf.position;
    return;
  }
  if (lastState && lastState.gps_status && (lastState.gps_status.fix === 0 || lastState.gps_status.fix === '0')) {
    $('gpsStatus').textContent = 'GPS SIN FIX';
  }
  if (!navigator.geolocation) {
    $('gpsStatus').textContent = 'GPS NO';
    return;
  }
  $('gpsStatus').textContent = 'GPS ...';
  navigator.geolocation.getCurrentPosition(async (pos) => {
    currentPosition = {
      lat: pos.coords.latitude,
      lon: pos.coords.longitude,
      accuracy: pos.coords.accuracy,
      source: 'browser'
    };
    const res = await postJson('/api/golf/position', currentPosition);
    updateGolf(res.golf);
  }, () => {
    $('gpsStatus').textContent = 'GPS OFF';
  }, {enableHighAccuracy: true, timeout: 7000, maximumAge: 30000});
}
async function logShot() {
  const club = $('shotClub').value;
  const yardsHit = num($('shotYards').value) || num(lastGolf && lastGolf.hole && lastGolf.hole.center) || 0;
  const res = await postJson('/api/golf/shot', {club, yards: yardsHit, result: 'registrado'});
  updateGolf(res.golf);
}
async function loadTests() {
  try {
    const res = await getJson('/api/tests/list');
    $('testList').innerHTML = res.tests.map(test => (
      `<button class="test-btn ${test.danger ? 'danger' : ''}" data-test="${test.id}">
        ${test.label}<span>${test.description}</span>
      </button>`
    )).join('');
    document.querySelectorAll('[data-test]').forEach(btn => {
      btn.onclick = () => runTest(btn.dataset.test).catch(console.error);
    });
    testsLoaded = true;
  } catch (err) {
    $('testLog').textContent = String(err);
  }
}
async function runTest(id) {
  $('testStatus').textContent = 'Lanzando';
  const res = await postJson('/api/tests/run', {id});
  activeRunId = res.run.id;
  $('activeRun').textContent = res.run.label;
  pollRun();
  clearInterval(runPoll);
  runPoll = setInterval(pollRun, 1200);
}
async function pollRun() {
  if (!activeRunId) return;
  const res = await getJson(`/api/tests/run/${activeRunId}`);
  const run = res.run;
  $('testStatus').textContent = run.status;
  const raw = (res.raw_rx || []).filter(Boolean).slice(-10).join('\n');
  $('testLog').textContent = `${res.log || ''}${raw ? '\n--- raw_rx ---\n' + raw : ''}`.trim() || 'Sin salida todavia.';
  if (run.status !== 'running') {
    clearInterval(runPoll);
    runPoll = null;
  }
}
function connectWs() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setConn(true);
  ws.onmessage = (event) => updateRobot(JSON.parse(event.data));
  ws.onclose = () => { setConn(false); setTimeout(connectWs, 1000); };
}

fillShotClub();
document.querySelectorAll('[data-mode]').forEach(btn => btn.onclick = () => setModePanel(btn.dataset.mode));
$('homeBtn').onclick = () => setModePanel('home');
$('exitBtn').onclick = () => exitKiosk().catch(console.error);
$('courseSearch').onclick = searchCourse;
$('courseQuery').addEventListener('keydown', (ev) => { if (ev.key === 'Enter') searchCourse(); });
$('saveHole').onclick = () => saveHole().catch(console.error);
$('useGps').onclick = useGps;
$('logShot').onclick = () => logShot().catch(console.error);
$('followOn').onclick = () => postJson('/api/follower', {enabled: true}).catch(console.error);
$('followOff').onclick = () => postJson('/api/follower', {enabled: false}).catch(console.error);
$('stop').onclick = stopMotion;
$('faceEnroll').onclick = () => enrollFaceId().catch(console.error);
$('faceSave').onclick = () => saveFaceId().catch(console.error);
$('faceClear').onclick = () => clearFaceId().catch(console.error);
$('gamepadToggle').onclick = () => setGamepadEnabled(!gamepadEnabled);
$('gamepadWait').onclick = () => postJson('/api/follower', {enabled: false}).then(() => sendCmd(0, 0)).catch(console.error);
$('gamepadStop').onclick = stopMotion;
$('stopFromTests').onclick = stopMotion;
$('refreshTests').onclick = () => { testsLoaded = false; loadTests(); };
$('clearLog').onclick = () => { $('testLog').textContent = 'Selecciona una prueba.'; };
document.querySelectorAll('[data-drive]').forEach(btn => {
  btn.addEventListener('pointerdown', () => startDrive(btn.dataset.drive));
  btn.addEventListener('pointerup', stopMotion);
  btn.addEventListener('pointercancel', stopMotion);
  btn.addEventListener('pointerleave', () => { if (driveTimer) stopMotion(); });
});
$('linearMax').oninput = () => $('linearMaxVal').textContent = Number($('linearMax').value).toFixed(2);
$('angularMax').oninput = () => $('angularMaxVal').textContent = Number($('angularMax').value).toFixed(2);
window.addEventListener('gamepadconnected', (ev) => {
  if (gamepadEnabled) {
    gamepadIndex = ev.gamepad.index;
    if (gamepadLoop) cancelAnimationFrame(gamepadLoop);
    gamepadLoop = null;
    processGamepad();
  }
  setGamepadUi(gamepadEnabled ? 'ON' : 'READY', ev.gamepad.id, gamepadEnabled);
});
window.addEventListener('gamepaddisconnected', () => {
  gamepadIndex = null;
  if (gamepadManualActive) sendCmd(0, 0);
  gamepadManualActive = false;
  setGamepadUi(gamepadEnabled ? 'PAIR' : 'OFF', 'Control desconectado.');
});
setInterval(() => {
  $('rgb').src = '/api/frame/rgb.jpg?t=' + Date.now();
}, 700);
loadGolf();
loadCourseCatalog();
loadIdentity();
connectWs();
</script>
